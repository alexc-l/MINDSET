constraint_config:
  use_eq: true
  use_iq: true
  use_ses: true
combination_class: agents.MBTI.MBTICombination
stages:
  - name: stress_chara
    class: agents.mindset.socio_demo_generator.StressCharaMetaProcess
    cache_enabled: true
    question_dependent: false   # Same for all questions → reuse
    include_metadata: false
    prompt_paths:
      default: socio_demo_profile/stress_chara_prompt
      metadata: socio_demo_profile/stress_chara_prompt_metadata
      snippet_paths:
        eq: socio_demo_profile/snippets/eq_snippet
        iq: socio_demo_profile/snippets/iq_snippet
        ses: socio_demo_profile/snippets/ses_snippet

  - name: mbti_select
    class: agents.MBTI.MBTISelectMetaProcess
    cache_enabled: true
    question_dependent: false   # Depends only on person, not question
    include_metadata: false
    prompt_paths:
      default: MBTI/mbti_select_prompt
      metadata: MBTI/mbti_select_prompt_metadata

  - name: get_stack
    class: agents.MBTI.GetStackMetaProcess
    cache_enabled: false
    question_dependent: false

  - name: assign_impact
    class: agents.MBTI.AssignImpactMetaProcess
    cache_enabled: true
    question_dependent: true
    include_metadata: false
    prompt_paths:
      default: MBTI/assign_impact_prompt
      metadata: MBTI/assign_impact_prompt_metadata

  - name: reason
    class: agents.MBTI.ReasonMetaProcess
    cache_enabled: true
    question_dependent: true
    include_metadata: false
    prompt_paths:
      default: MBTI/reason_prompt
      metadata: MBTI/reason_prompt_metadata

  - name: synthesis
    class: agents.MBTI.SynthesisMetaProcess
    cache_enabled: true
    question_dependent: true
    include_metadata: false
    prompt_paths:
      default: MBTI/preference_synthesis_prompt
      metadata: MBTI/preference_synthesis_prompt_metadata

  - name: apply_constraints
    class: agents.mindset.constraints.ConstraintMetaProcess
    cache_enabled: true
    question_dependent: true
    include_metadata: false
    prompt_paths:
      default: constraints/unified_constraint_prompt
      metadata: constraints/unified_constraint_prompt_metadata
      snippet_paths:
        eq: constraints/snippets/eq_snippet
        iq: constraints/snippets/iq_snippet
        ses: constraints/snippets/ses_snippet